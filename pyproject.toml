[project]
name = "pbme"
version = "0.1.0"
description = "PAST-Bench memory self-evolution experiment harness"
requires-python = ">=3.10"

# 运行依赖由 benchmarks/PAST-Bench/.venv 提供（past-bench、pyyaml、openai 等）。
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
